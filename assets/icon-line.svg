<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <!-- KakaoAdHide line icon (KakaoTalk sidebar button, tray, menu bar): the app icon's shapes as one-colour
       lines. The blank ad (banner.rs) and the tray icon (ui.rs) draw these same shapes. -->
  <!-- top: the bubble, filled (as big as the outlined slot below, stroke included); bottom: the emptied slot -->
  <rect x="2" y="3" width="20" height="8.5" rx="4.25" fill="currentColor" stroke="none"/>
  <rect x="3" y="13.5" width="18" height="6.5" rx="3.25"/>
</svg>
