name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: cargo test --locked

      # Lints on each platform's own code too: a warning in Windows-only code fails here, macOS-only in build-macos.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        shell: powershell
        run: ./packaging/windows/build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KakaoAdHide-windows
          path: |
            dist/KakaoAdHide-windows.exe
            dist/SHA256SUMS.txt

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Signed with the release certificate when the secrets are available (pushes to this repository), so the
      # signing step is exercised before a tag; ad-hoc signed otherwise (pull requests from forks).
      - name: Build
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: packaging/macos/build.sh --dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KakaoAdHide-macos
          path: dist/KakaoAdHide-macos.dmg

  # Known vulnerabilities in the dependencies (RustSec advisory database). Fails on a vulnerability; warnings
  # (unmaintained, unsound) are shown but don't fail, as the two current ones are in Linux-only crates.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # The universal app also runs on Intel Macs: run the tests natively there.
  test-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------------------------------------
  # On a v* tag: build both apps, sign both update feeds (SIGNING_KEY_ED25519, plus the RSA SIGNING_PRIVATE_KEY for
  # copies before 2.5.1), check each feed
  # with the app built for it, and upload everything as a DRAFT release. Nothing reaches users until the draft
  # is published (releases/latest/download/latest-*.json, which the apps read, ignores drafts).

  # The macOS app, signed with the self-signed release certificate (tools/new-macos-signing-cert.sh).
  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "v$version" == "${{ github.ref_name }}" ]] || { echo "tag ${{ github.ref_name }} does not match VERSION ($version)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [[ -n "$MACOS_SIGNING_P12" ]] || { echo 'MACOS_SIGNING_P12 secret is not set (tools/new-macos-signing-cert.sh --set-secret)'; exit 1; }
          packaging/macos/build.sh --dmg --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-dmg
          path: dist/KakaoAdHide-macos.dmg

  # The Windows app, and the signing of both feeds (the key stays on this one job).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match VERSION ($version)" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: ./packaging/windows/build.ps1 -Version $env:VERSION

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-dmg
          path: dist

      - name: Sign
        shell: powershell
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_ED25519: ${{ secrets.SIGNING_KEY_ED25519 }}
        run: |
          if (-not $env:SIGNING_PRIVATE_KEY) { throw 'SIGNING_PRIVATE_KEY secret (RSA) is not set' }
          if (-not $env:SIGNING_KEY_ED25519) { throw 'SIGNING_KEY_ED25519 secret is not set (docs/development.md)' }
          # RSA "signature": what copies before 2.5.1 check (drop with tools/feed-sign/src/legacy_rsa.rs)
          ./tools/sign-release.ps1 -Exe dist/KakaoAdHide-windows.exe -Version $env:VERSION -Tag "${{ github.ref_name }}"
          ./tools/sign-release.ps1 -Exe dist/KakaoAdHide-macos.dmg -Version $env:VERSION -Tag "${{ github.ref_name }}" -Out dist/latest-macos.json
          # Ed25519 "signature_ed25519", and the bottom banner's ad placement ids (ad-units/), signed on their own;
          # units.yml re-signs them later
          foreach ($p in 'windows', 'macos') {
            cargo run --locked --release --quiet --manifest-path tools/feed-sign/Cargo.toml -- release "dist/latest-$p.json"
            if ($LASTEXITCODE -ne 0) { throw "feed-sign release $p failed" }
            cargo run --locked --release --quiet --manifest-path tools/feed-sign/Cargo.toml -- units "dist/latest-$p.json" $p
            if ($LASTEXITCODE -ne 0) { throw "feed-sign units $p failed" }
          }

      - name: Verify with the built exe
        shell: powershell
        run: |
          $p = Start-Process dist/KakaoAdHide-windows.exe -ArgumentList '--verify-feed', 'dist/latest-windows.json', 'dist/KakaoAdHide-windows.exe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "update feed does not verify against the keys in src/keys.rs (exit $($p.ExitCode))" }

      - name: Checksums for both platforms
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/KakaoAdHide-macos.dmg -Algorithm SHA256).Hash.ToLower()
          "$hash  KakaoAdHide-macos.dmg" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/KakaoAdHide-windows.exe
            dist/latest-windows.json
            dist/KakaoAdHide-macos.dmg
            dist/latest-macos.json
            dist/SHA256SUMS.txt

  # Check the macOS feed with the macOS app (same code path users run: feed signature, then the app inside the
  # disk image and its code signature), then create the draft release.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify with the built app
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" dist/KakaoAdHide-macos.dmg
          ditto "$mnt/KakaoAdHide.app" "$RUNNER_TEMP/KakaoAdHide.app"
          hdiutil detach "$mnt"
          "$RUNNER_TEMP/KakaoAdHide.app/Contents/MacOS/KakaoAdHide" --verify-feed dist/latest-macos.json dist/KakaoAdHide-macos.dmg \
            || { echo "macOS update feed does not verify (exit $?): keys in src/keys.rs, certificate in src/platform/macos.rs"; exit 1; }

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "${{ github.ref_name }}" --generate-notes \
            dist/KakaoAdHide-windows.exe dist/latest-windows.json dist/KakaoAdHide-macos.dmg dist/latest-macos.json dist/SHA256SUMS.txt
