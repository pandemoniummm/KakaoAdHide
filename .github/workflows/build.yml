name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KakaoAdHide
          path: |
            dist/KakaoAdHide-windows.exe
            dist/SHA256SUMS.txt

  # On a v* tag: build, sign with the SIGNING_PRIVATE_KEY secret, check the result with the built exe
  # itself, and upload everything as a DRAFT release. Nothing reaches users until the draft is published
  # (releases/latest/download/latest-windows.json, which the app reads, ignores drafts).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match VERSION ($version)" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: ./build.ps1 -Version $env:VERSION

      - name: Sign
        shell: powershell
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_PRIVATE_KEY) { throw 'SIGNING_PRIVATE_KEY secret is not set (tools/new-signing-keys.ps1 -SetSecret)' }
          ./tools/sign-release.ps1 -Exe dist/KakaoAdHide-windows.exe -Version $env:VERSION -Tag "${{ github.ref_name }}"

      - name: Verify with the built exe
        shell: powershell
        run: |
          $p = Start-Process dist/KakaoAdHide-windows.exe -ArgumentList '--verify-feed', 'dist/latest-windows.json', 'dist/KakaoAdHide-windows.exe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "update feed does not verify against the keys in src/UpdateKeys.cs (exit $($p.ExitCode))" }

      - name: Draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/KakaoAdHide-windows.exe dist/latest-windows.json dist/SHA256SUMS.txt --draft --title "${{ github.ref_name }}" --generate-notes
