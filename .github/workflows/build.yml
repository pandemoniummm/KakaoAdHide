name: build

# Pushes and pull requests that only touch the page, the docs or Markdown skip the build (tag pushes always run:
# path filters don't apply to tags).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['site/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run. Tags never cancel (a release run
# finishes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compiled dependencies, keyed on Cargo.lock. Not in the release jobs below, which build from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

      # Lints on each platform's own code too: a warning in Windows-only code fails here, macOS-only in build-macos.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        shell: powershell
        run: ./packaging/windows/build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KakaoAdHide-windows
          path: |
            dist/KakaoAdHide-windows.exe
            dist/SHA256SUMS.txt

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compiled dependencies, keyed on Cargo.lock. Not in the release jobs below, which build from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Signed with the release certificate when the secrets are available (pushes to this repository), so the
      # signing step is exercised before a tag; ad-hoc signed otherwise (pull requests from forks).
      - name: Build
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: packaging/macos/build.sh --dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KakaoAdHide-macos
          path: dist/KakaoAdHide-macos.dmg

  # Known vulnerabilities in the dependencies (RustSec advisory database). Fails on a vulnerability; warnings
  # (unmaintained, unsound) are shown but don't fail, as the two current ones are in Linux-only crates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # a prebuilt cargo-audit (building it took most of this job)
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # The universal app also runs on Intel Macs: run the tests natively there.
  test-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compiled dependencies, keyed on Cargo.lock. Not in the release jobs below, which build from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------------------------------------
  # On a v* tag: build both apps, sign both update feeds (SIGNING_KEY_ED25519), check each feed
  # with the app built for it, and upload everything as a DRAFT release. Nothing reaches users until the draft
  # is published (releases/latest/download/feed-*.json, update-*.json and latest-*.json, which the apps read,
  # ignore drafts).

  # The macOS app, signed with the self-signed release certificate (tools/new-macos-signing-cert.sh). Starts with
  # the test jobs instead of after them (macOS runners can take many minutes to come); the signing job below
  # waits for every test job.
  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "v$version" == "${{ github.ref_name }}" ]] || { echo "tag ${{ github.ref_name }} does not match VERSION ($version)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [[ -n "$MACOS_SIGNING_P12" ]] || { echo 'MACOS_SIGNING_P12 secret is not set (tools/new-macos-signing-cert.sh --set-secret)'; exit 1; }
          packaging/macos/build.sh --dmg --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-dmg
          path: dist/KakaoAdHide-macos.dmg

  # The Windows app, and the signing of both feeds (the key stays on this one job).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos, test-macos-intel, audit, release-macos]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match VERSION ($version)" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: ./packaging/windows/build.ps1 -Version $env:VERSION

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-dmg
          path: dist

      - name: Sign
        shell: powershell
        env:
          SIGNING_KEY_ED25519: ${{ secrets.SIGNING_KEY_ED25519 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:SIGNING_KEY_ED25519) { throw 'SIGNING_KEY_ED25519 secret is not set (docs/development.md)' }
          $tag = "${{ github.ref_name }}"
          function FeedSign { cargo run --locked --release --quiet --manifest-path tools/feed-sign/Cargo.toml -- @args; if ($LASTEXITCODE -ne 0) { throw "feed-sign $args failed" } }
          $packages = @{ windows = 'dist/KakaoAdHide-windows.exe'; macos = 'dist/KakaoAdHide-macos.dmg' }
          foreach ($p in 'windows', 'macos') {
            # feed-*.json: the feed 2.6.0 and later read (Ed25519, "TalkNap" messages), with the bottom banner's ad
            # placement ids (ad-units/) signed on their own; units.yml re-signs them later
            FeedSign new $packages[$p] $env:VERSION $tag "dist/feed-$p.json"
            FeedSign units "dist/feed-$p.json" $p
            # update-*.json: the feed copies 2.5.2 read ("KakaoAdHide" messages), kept as the 2.6.0 release's (the
            # bridge): 2.5.2 updates to 2.6.0 first, then follows feed-*.json. Copied unchanged except the ad
            # placement ids (re-signed, so a changed id reaches 2.5.2 too); 2.6.0's exe and dmg never change.
            # Only the 2.6.0 release makes them (packaging/bridge/README.md); it has to be committed after that.
            if (Test-Path "packaging/bridge/update-$p.json") {
              Copy-Item "packaging/bridge/update-$p.json" "dist/update-$p.json"
              # the committed bridge must still match the published 2.6.0 package (old message, old prefix)
              $asset = Split-Path $packages[$p] -Leaf
              gh release download v2.6.0 --repo "${{ github.repository }}" -D bridge-check -p $asset --clobber
              if ($LASTEXITCODE -ne 0) { throw "could not download $asset from the v2.6.0 release to check the bridge" }
              cargo run --locked --release --quiet --manifest-path tools/feed-sign/Cargo.toml -- verify "dist/update-$p.json" "bridge-check/$asset" --legacy
              if ($LASTEXITCODE -ne 0) { throw "packaging/bridge/update-$p.json does not verify against the v2.6.0 release's $asset (--legacy)" }
              FeedSign units "dist/update-$p.json" $p --legacy
            } elseif ($env:VERSION -eq '2.6.0') {
              FeedSign new $packages[$p] $env:VERSION $tag "dist/update-$p.json" --legacy
              FeedSign units "dist/update-$p.json" $p --legacy
              FeedSign verify "dist/update-$p.json" $packages[$p] --legacy
            } else {
              throw "packaging/bridge/update-$p.json is missing (2.6.0 bridge)"
            }
            # latest-*.json: the feed copies before 2.5.2 read, kept as the 2.5.2 release's (the bridge): they update
            # to 2.5.2 first, then follow update-*.json. Carried unchanged; 2.5.2's exe and dmg never change.
            if (-not (Test-Path "packaging/bridge/latest-$p.json")) { throw "packaging/bridge/latest-$p.json is missing" }
            Copy-Item "packaging/bridge/latest-$p.json" "dist/latest-$p.json"
          }

      - name: Verify with the built exe
        shell: powershell
        run: |
          # (update-*.json is the 2.6.0 bridge, checked by feed-sign verify when 2.6.0 was released; latest-*.json
          # is the 2.5.2 bridge, checked when 2.5.2 was released)
          $p = Start-Process dist/KakaoAdHide-windows.exe -ArgumentList '--verify-feed', 'dist/feed-windows.json', 'dist/KakaoAdHide-windows.exe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "feed-windows.json does not verify against the keys in src/keys.rs (exit $($p.ExitCode))" }

      - name: Checksums for both platforms
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/KakaoAdHide-macos.dmg -Algorithm SHA256).Hash.ToLower()
          "$hash  KakaoAdHide-macos.dmg" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/KakaoAdHide-windows.exe
            dist/feed-windows.json
            dist/update-windows.json
            dist/latest-windows.json
            dist/KakaoAdHide-macos.dmg
            dist/feed-macos.json
            dist/update-macos.json
            dist/latest-macos.json
            dist/SHA256SUMS.txt

  # Check the macOS feed with the macOS app (same code path users run: feed signature, then the app inside the
  # disk image and its code signature), then create the draft release.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify with the built app
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" dist/KakaoAdHide-macos.dmg
          ditto "$mnt/KakaoAdHide.app" "$RUNNER_TEMP/KakaoAdHide.app"
          hdiutil detach "$mnt"
          # (update-macos.json is the 2.6.0 bridge, checked by feed-sign verify when 2.6.0 was released; latest-macos.json
          # is the 2.5.2 bridge, checked when 2.5.2 was released)
          "$RUNNER_TEMP/KakaoAdHide.app/Contents/MacOS/KakaoAdHide" --verify-feed dist/feed-macos.json dist/KakaoAdHide-macos.dmg \
            || { echo "feed-macos.json does not verify (exit $?): keys in src/keys.rs, certificate in src/platform/macos.rs"; exit 1; }

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "${{ github.ref_name }}" --generate-notes \
            dist/KakaoAdHide-windows.exe dist/feed-windows.json dist/update-windows.json dist/latest-windows.json \
            dist/KakaoAdHide-macos.dmg dist/feed-macos.json dist/update-macos.json dist/latest-macos.json dist/SHA256SUMS.txt
