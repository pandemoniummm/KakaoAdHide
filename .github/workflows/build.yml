name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: KakaoAdHide
          path: |
            dist/KakaoAdHide.exe
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/KakaoAdHide.exe dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --generate-notes
