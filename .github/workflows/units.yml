name: units

# Puts the ad placement ids in ad-units/ (main) into the latest release's update feeds, signed, without a new
# release: for when KakaoTalk changes the bottom banner's id (#10). Run by hand (Actions → units → Run workflow)
# after the new id is in ad-units/<platform>.txt on main. The apps pick the list up at their next update check.
# The feeds' other fields and their signatures stay as they are. Copies before 2.5.1 ignore the list (it is signed
# with Ed25519 now).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  units:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign into the latest release's feeds
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_ED25519: ${{ secrets.SIGNING_KEY_ED25519 }}
        run: |
          if (-not $env:SIGNING_KEY_ED25519) { throw 'SIGNING_KEY_ED25519 secret is not set' }
          $tag = gh release view --repo "${{ github.repository }}" --json tagName -q .tagName
          if (-not $tag) { throw 'no published release' }
          New-Item -ItemType Directory -Force dist | Out-Null
          # update-*.json from 2.5.2 on; latest-*.json is the bridge for older copies and isn't touched
          gh release download $tag --repo "${{ github.repository }}" -D dist -p update-windows.json -p update-macos.json
          foreach ($p in 'windows', 'macos') {
            cargo run --locked --release --quiet --manifest-path tools/feed-sign/Cargo.toml -- units "dist/update-$p.json" $p
            if ($LASTEXITCODE -ne 0) { throw "feed-sign units $p failed" }
          }
          Get-Content dist/update-windows.json, dist/update-macos.json | Select-String 'version|DAN-'
          gh release upload $tag --repo "${{ github.repository }}" --clobber dist/update-windows.json dist/update-macos.json
          "updated the feeds of $tag"
