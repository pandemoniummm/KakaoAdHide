<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 260 260">
  <!-- KakaoAdHide app icon: a chat bubble above, the emptied ad slot (dashed) below.
       Source for every app icon size (tools/icon-gen). The dashed box is inset by half its stroke so its outer
       edge lines up with the filled bubble. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47e0b8"/>
      <stop offset="1" stop-color="#1f8fd6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="258" height="258" rx="59" fill="url(#tile)" stroke="#dde2ec" stroke-width="2"/>
  <rect x="52" y="56" width="156" height="60" rx="23" fill="url(#mint)"/>
  <rect x="74" y="79" width="80" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="55.5" y="143.5" width="149" height="57" rx="19.5" fill="none" stroke="#2b3040" stroke-width="7" stroke-dasharray="13 9"/>
</svg>
