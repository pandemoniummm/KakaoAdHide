[package]
name = "kakaoadhide"
# The released version comes from VERSION (build scripts check that it matches this).
version = "2.5.0"
edition = "2021"
license = "MIT"
description = "Empties the ad banner of KakaoTalk for Windows and macOS by serving a blank ad locally"
publish = false

[[bin]]
name = "KakaoAdHide"
path = "src/main.rs"

[dependencies]
# One crypto backend for everything (TLS, certificate generation, update signature checks).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
time = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tray-icon = "0.26"
muda = "0.21"
tao = "0.37"
rfd = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Accessibility",
] }
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by tao and muda: whether KakaoTalk is the active app (NSWorkspace activation notifications).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSOperation", "NSArray", "NSDictionary", "NSValue", "NSEnumerator", "NSSet", "NSError", "NSBundle"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationCategory", "UNNotificationAction", "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNNotificationTrigger"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
